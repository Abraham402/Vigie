name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: bot/requirements.txt
      - run: pip install -r bot/requirements.txt
      - run: python -m pytest -q
        working-directory: bot

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Vérifier la syntaxe JavaScript
        run: for f in assets/*.js sw.js; do node --check "$f"; done
      - name: Vérifier les fichiers JSON
        run: for f in manifest.webmanifest config/settings.json; do node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))"; done
